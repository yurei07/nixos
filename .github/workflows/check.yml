name: Check flake
 
on:
  push:
    branches: [ main ]
    paths:
      - '**.nix'
      - 'flake.lock'
      - '.github/workflows/check.yml'
  pull_request:
    paths:
      - '**.nix'
      - 'flake.lock'
 
jobs:
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
 
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
 
      - name: Enable Magic Nix Cache (speeds up repeat builds)
        uses: DeterminateSystems/magic-nix-cache-action@main
 
      - name: Run nix flake check
        run: nix flake check --all-systems
 
      - name: Build toplevel (catches config-level errors)
        run: |
          nix build .#nixosConfigurations.nixos.config.system.build.toplevel \
            --no-link \
            --print-build-logs
 
      - name: Check flake formatting (optional, requires nixfmt/alejandra set up)
        run: nix fmt -- --check . || echo "No formatter configured yet, skipping"
        continue-on-error: true
 

