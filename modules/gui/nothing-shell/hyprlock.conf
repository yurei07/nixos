# NOTHING-SHELL hyprlock: grainy wallpaper behind, big Ndot clock, Lettera labels.
background {
    monitor = eDP-1
    path = screenshot
    blur_passes = 3
    blur_size = 8
    color = rgba(0, 0, 0, 0.55)
}

label {
    monitor = eDP-1
    text = cmd[update:1000] echo -n "$(date +'%H:%M')"
    font_size = 110
    font_family = Ndot 57,
    color = rgba(255, 255, 255, 1.0)
    position = 0, 180
    halign = center
    valign = center
}

label {
    monitor = eDP-1
    text = LOCKED
    font_size = 13
    font_family = Lettera Mono LL
    color = rgba(255, 255, 255, 0.6)
    position = 0, 60
    halign = center
    valign = center
}

input-field {
    monitor = eDP-1
    size = 320, 46
    position = 0, -60
    halign = center
    valign = center
    rounding = 23
    outline_color = rgba(46, 46, 46, 1.0)
    inner_color = rgba(10, 10, 10, 0.8)
    font_color = rgba(255, 255, 255, 1.0)
    font_family = Lettera Mono LL
    placeholder_text = <span size="9000" foreground="#8C8C8C">password…</span>
    capslock_color = rgba(215, 25, 33, 1.0)
    check_color = rgba(255, 255, 255, 1.0)
    fail_color = rgba(215, 25, 33, 1.0)
}
